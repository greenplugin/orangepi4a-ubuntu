services:
  builder-arm:
    build:
      context: .
      dockerfile: Dockerfile.arm
    platform: linux/arm64
    privileged: true
    volumes:
      # Source repository (read-only)
      - ../:/repo:ro
      # Build script
      - ./build-arm.sh:/build/build-arm.sh:ro
      # Persistent caches (local bind mounts)
      - ./.cache/kernel:/build/kernel
      - ./.cache/uboot:/build/uboot
      - ./.cache/rootfs:/build/rootfs-cache
      - ./.cache/rootfs-desktop:/build/rootfs-desktop-cache
      - ./.cache/debootstrap:/build/debootstrap-cache
      - ./.cache/firmware:/build/firmware
      - ./.cache/ccache:/root/.ccache
    environment:
      - CCACHE_DIR=/root/.ccache
      - BOARD=${BOARD:-orangepi4a}
      - RELEASE=${RELEASE:-noble}
      - DEFAULT_USER=${DEFAULT_USER:-ubuntu}
      - DEFAULT_PASS=${DEFAULT_PASS:-ubuntu}
      - BUILD_DESKTOP=${BUILD_DESKTOP:-true}
      - DESKTOP_FLAVOR=${DESKTOP_FLAVOR:-gnome}
      - DESKTOP_AUTOLOGIN=${DESKTOP_AUTOLOGIN:-1}
    command: bash /build/build-arm.sh

  builder-pack:
    build:
      context: .
      dockerfile: Dockerfile.pack
    platform: linux/amd64
    privileged: true
    depends_on:
      builder-arm:
        condition: service_completed_successfully
    volumes:
      # Source repository (read-only)
      - ../:/repo:ro
      # Build script
      - ./build-pack.sh:/build/build-pack.sh:ro
      # Shared artifacts from ARM stage (local bind mounts)
      - ./.cache/kernel:/build/kernel:ro
      - ./.cache/uboot:/build/uboot
      - ./.cache/rootfs:/build/rootfs-cache
      - ./.cache/rootfs-desktop:/build/rootfs-desktop-cache
      # Output directory
      - ./output:/build/output
    environment:
      - BOARD=${BOARD:-orangepi4a}
      - RELEASE=${RELEASE:-noble}
      - BUILD_DESKTOP=${BUILD_DESKTOP:-true}
      - DESKTOP_FLAVOR=${DESKTOP_FLAVOR:-gnome}
    command: bash /build/build-pack.sh
